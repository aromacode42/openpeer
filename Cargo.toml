[package]
name = "openpeer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "openpeer"
path = "src/lib.rs"

[[bin]]
name = "opserver"
required-features = []
path = "src/bin/opserver.rs"

[[bin]]
name = "opclient"
required-features = []
path = "src/bin/opclient.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
bytes = { version = "1", features = ["std"] }
snow = "0.9"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
bincode = "2"
tokio-stream = "0.1"
pin-project = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "bench"
harness = false

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
strip = true