name: Bug report
description: Create a report to help us improve
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Tell us what you expected vs what happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `opclient --version` and OS details
      placeholder: |
        opclient version: ...
        OS: ...
        Rust: ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant log lines (redact any IPs/keys)
      placeholder: |
        [2026-04-26T00:00:00Z INFO openpeer::p2p] ...
